services:
  hoto:
    build:
      context: .
    ports:
      - "7777:7777"
    volumes:
      - hoto-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.claude:/root/.claude
    env_file:
      - .env
    environment:
      # Override URLs to use Docker internal service names
      HOTO_HOST: "0.0.0.0"
      HOTO_PORT: "7777"
      HOTO_WORKSPACE: /data
      CHROMA_URL: http://chromadb:8000
      MATRIX_HOMESERVER_URL: http://synapse:8008
      GITEA_URL: http://moxy:3777
      OLLAMA_HOST: http://ollama:11434
      HOTO_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-helm-of-the-overlord}_hoto-data
      HOTO_GIT_COMMIT: ${GIT_COMMIT:-}
      HOTO_GIT_DATETIME: ${GIT_DATETIME:-}
    depends_on:
      - chromadb
      - synapse
      - gitea
      - ollama

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: hoto-sandbox:latest
    entrypoint: ["true"]
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/scripts/ollama-init.sh"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./scripts/ollama-init.sh:/scripts/ollama-init.sh:ro

  chromadb:
    image: ghcr.io/chroma-core/chroma:1.5.5
    ports:
      - "8033:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_HTTP_PORT=8033

  synapse:
    image: matrixdotorg/synapse:v1.149.1
    entrypoint: ["/bin/bash", "/scripts/synapse-init.sh"]
    ports:
      - "8098:8008"
    volumes:
      - synapse-data:/data
      - ./scripts/synapse-init.sh:/scripts/synapse-init.sh:ro

  gitea:
    image: gitea/gitea:1.25.5
    entrypoint: ["/bin/sh", "/hoto-scripts/gitea-init.sh"]
    ports:
      - "3777:3777"
    volumes:
      - gitea-data:/data
      - ./scripts/gitea-init.sh:/hoto-scripts/gitea-init.sh:ro
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__server__ROOT_URL: http://${HOTO_HOSTNAME:-localhost}:3777
      GITEA__server__HTTP_PORT: "3777"
      GITEA__server__DOMAIN: ${HOTO_HOSTNAME:-localhost}
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__api__ENABLE_SWAGGER: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DISABLE_SSH: "true"

volumes:
  hoto-data:
  ollama-data:
  chroma-data:
  synapse-data:
  gitea-data:
