  chromadb:
    image: ghcr.io/chroma-core/chroma:1.5.5
    ports:
      - "8033:8033"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_HTTP_PORT=8033

  synapse:
    image: matrixdotorg/synapse:v1.149.1
    entrypoint: ["/bin/bash", "/scripts/synapse-init.sh"]
    ports:
      - "8098:8098"
    volumes:
      - synapse-data:/data
      - ./scripts/synapse-init.sh:/scripts/synapse-init.sh:ro

  gitea:
    image: gitea/gitea:1.25.5
    entrypoint: ["/bin/sh", "/hoto-scripts/gitea-init.sh"]
    ports:
      - "3777:3777"
    volumes:
      - gitea-data:/data
      - ./scripts/gitea-init.sh:/hoto-scripts/gitea-init.sh:ro
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__server__ROOT_URL: http://gitea:3777
      GITEA__server__HTTP_PORT: "3777"
      GITEA__server__DOMAIN: gitea
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__api__ENABLE_SWAGGER: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DISABLE_SSH: "true"

volumes:
  hoto-data:
  chroma-data:
  synapse-data:
  gitea-data:
